<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMLand</title>
<link rel="stylesheet" href="/theme.css">

</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="window">
  <aside class="side">
    <div class="side-heading">
      <div class="logo">DMLand</div>
      <button type="button" class="iconbtn mobile-menu" id="menu-toggle" aria-controls="nav" aria-expanded="false" aria-label="Navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
    <div class="brandsw" id="brandsw"></div>
    <nav class="menu" id="nav" aria-label="Navigation"></nav>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<div id="modal"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
/* ---------- language (interface only) ---------- */
// English is the base language. Any other language is a file: public/lang/<code>.json
//   { "name": "Español",
//     "dict":     { "Home": "Inicio", "{0} send errors in {1}": "{0} errores de envío en {1}" },   // exact text -> translation ({0} = values)
//     "patterns": [ ["^(\\d+) min ago$", "hace $1 min"] ],                                         // regex -> template ($1 raw, $t1 translated)
//     "events":   [ ["^Connected @(.+)$", "Conectada @$1"] ] }                                      // same, for Activity log lines
// Only what the dashboard shows is translated. Your messages, replies, names, keywords, comments and saved data
// carry translate="no" and never pass through here.
let LANG = store.get('lang', 'en');
let PACK = null; // the loaded language file, or null while the language is English
document.documentElement.lang = LANG;
const compile = (list) => (list || []).map(([re, tpl]) => [new RegExp(re), tpl]);
async function loadLang(code) {
  PACK = null; LANG = 'en';
  if (code && code !== 'en') {
    try {
      const r = await fetch('/lang/' + encodeURIComponent(code) + '.json'); if (!r.ok) throw new Error(r.statusText);
      const j = await r.json(); PACK = { dict: j.dict || {}, rx: compile(j.patterns), ev: compile(j.events) }; LANG = code;
    } catch { /* unknown language: stay in English */ }
  }
  document.documentElement.lang = LANG;
}
const fillTpl = (tpl, m) => tpl.replace(/\$(t?)(\d)/g, (_, t, i) => (t ? tr(m[i] ?? '') : m[i] ?? ''));
function tr(s) {
  if (!PACK) return s;
  const k = String(s);
  if (Object.prototype.hasOwnProperty.call(PACK.dict, k)) return PACK.dict[k];
  for (const [re, tpl] of PACK.rx) { const m = k.match(re); if (m) return fillTpl(tpl, m); }
  return s;
}
// T('plain text'), or T as a tagged template when the text has values: the translated text for the current language.
const T = (strs, ...vals) => {
  if (typeof strs === 'string') return tr(strs);
  let key = strs[0]; for (let i = 0; i < vals.length; i++) key += '{' + i + '}' + strs[i + 1];
  const t = PACK && Object.prototype.hasOwnProperty.call(PACK.dict, key) ? PACK.dict[key] : key;
  return t.replace(/\{(\d+)\}/g, (_, i) => vals[i]);
};
// Activity log lines: shown translated only when a language is loaded; unknown lines are left as they are (the saved data never changes).
const trEvent = (note) => { if (!PACK) return note; for (const [re, tpl] of PACK.ev) { const m = String(note).match(re); if (m) return fillTpl(tpl, m); } return note; };
const SKIP_TAGS = new Set(['SCRIPT', 'STYLE', 'TEXTAREA', 'CODE']);
function trNode(n) {
  if (n.nodeType === 3) {
    const p = n.parentElement; if (!p || SKIP_TAGS.has(p.tagName) || p.closest('[translate="no"]')) return;
    const m = n.nodeValue.match(/^(\s*)([\s\S]*?)(\s*)$/); if (!m[2]) return;
    const out = tr(m[2]); if (out !== m[2]) n.nodeValue = m[1] + out + m[3];
  } else if (n.nodeType === 1 && !SKIP_TAGS.has(n.tagName)) {
    for (const a of ['placeholder', 'title', 'aria-label']) { const v = n.getAttribute(a); if (v) { const out = tr(v); if (out !== v) n.setAttribute(a, out); } }
    n.childNodes.forEach(trNode);
  }
}
new MutationObserver((recs) => { if (!PACK) return; for (const r of recs) { if (r.type === 'characterData') trNode(r.target); else r.addedNodes.forEach(trNode); } })
  .observe(document.body, { childList: true, subtree: true, characterData: true });
async function setLang(l) { ['#brandsw', '#nav', '#sidefoot'].forEach((q) => { const e = document.querySelector(q); if (e) e._h = null; }); await loadLang(l); store.set('lang', LANG); render(); }

const api = async (path, method = 'GET', body) => {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.replace('/login'); throw new Error('Authentication required'); }
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j;
};
const toast = (msg, kind = 'good') => { const d = document.createElement('div'); d.className = kind; d.textContent = msg; $('#toast').append(d); setTimeout(() => d.remove(), kind === 'bad' ? 6500 : 3200); };
const confirmBox = (title, text, okLabel = 'Delete') => new Promise((resolve) => {
  const root = $('#modal');
  root.innerHTML = `<dialog class="modal" aria-labelledby="modal-title"><h2 id="modal-title">${esc(title)}</h2><p class="mute">${esc(text)}</p><form class="act" method="dialog"><button class="btn sec" value="cancel" autofocus>Cancel</button><button class="btn ${okLabel === 'Delete' || okLabel === 'Remove' ? 'del' : 'pri'}" value="confirm">${esc(okLabel)}</button></form></dialog>`;
  const dialog = $('dialog', root);
  dialog.addEventListener('close', () => {
    const accepted = dialog.returnValue === 'confirm';
    root.replaceChildren();
    resolve(accepted);
  }, { once: true });
  dialog.showModal();
});

/* ---------- icons ---------- */
const P = {
  home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  chart: '<path d="M5 21V10M12 21V4M19 21v-7"/>',
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 1.8 4 4.5"/>',
  meta: '<path d="M7 8c-2.5 0-4 2-4 4s1.5 4 4 4c4 0 6-8 10-8 2.5 0 4 2 4 4s-1.5 4-4 4c-4 0-6-8-10-8z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', send: '<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/>', alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v5M12 18v.1"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  play: '<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>', check: '<path d="m5 12 5 5 9-10"/>', chev: '<path d="m6 9 6 6 6-6"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
  tag: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>', bolt2: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
};
const ic = (n, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ---------- state ---------- */
const S = { brands: [], channels: [], autos: [], poller: null, media: {}, brand: store.get('brand', 'all'), tab: 'inicio', editing: null, filter: 'all' };
const TABS = [['inicio', 'Home', 'home'], ['analisis', 'Analytics', 'trend'], ['automatizaciones', 'Automations', 'bolt'], ['actividad', 'Activity', 'chart'], ['contactos', 'Contacts', 'users'], ['conexion', 'Meta connection', 'meta'], ['ajustes', 'Settings', 'gear']];
const inScope = (brandId) => S.brand === 'all' || String(brandId) === String(S.brand);
const scopeChannels = () => S.channels.filter((c) => inScope(c.brand_id));
const brandOf = (channelId) => S.brands.find((b) => b.id === S.channels.find((c) => c.id === channelId)?.brand_id);
const chLabel = (id) => { const c = S.channels.find((c) => c.id === id); return c ? `${brandOf(id)?.name || '?'} · @${c.username}` : '?'; };
const utc = (s) => new Date(String(s).replace(' ', 'T') + 'Z');
const ago = (s) => { const m = Math.round((Date.now() - utc(s)) / 60000); if (m < 1) return 'just now'; if (m < 60) return `${m} min ago`; const h = Math.round(m / 60); return h < 24 ? `${h} h ago` : `${Math.round(h / 24)} d ago`; };
const initials = (u) => String(u || '?').replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || '?';
const AVG = ['var(--g-amber)', 'var(--g-violet)', 'var(--g-rose)', 'var(--g-blue)'];
const avatar = (u) => `<span class="av" style="background:${AVG[(String(u).length + (String(u).charCodeAt(0) || 0)) % 4]}">${esc(initials(u))}</span>`;
const CAP = { waiting: '<span class="st warn">Waiting for email</span>', got_email: '<span class="st warn">Sending resource</span>', done: '<span class="st ok">Email captured</span>', expired: '<span class="st mute">No email</span>', failed: '<span class="st bad">Couldn\'t send</span>' };
const stChip = (r) => r.status === 'error' ? '<span class="st bad">Error</span>' : r.capture_status ? CAP[r.capture_status] : r.status === 'done' ? '<span class="st ok">Sent</span>' : r.status === 'pending' ? '<span class="st warn">Waiting</span>' : '<span class="st bad">Error</span>';

async function loadBase() {
  [S.brands, S.channels, S.autos, S.poller] = await Promise.all([api('/api/brands'), api('/api/channels'), api('/api/automations'), api('/api/poller')]);
  if (S.brand !== 'all' && !S.brands.some((b) => String(b.id) === String(S.brand))) S.brand = 'all';
}
const mediaInFlight = {};
async function loadMedia(channelId) {
  if (S.media[channelId]) return S.media[channelId];
  if (mediaInFlight[channelId]) return mediaInFlight[channelId]; // callers that arrive while it loads wait for the same request
  S.media[channelId] = null; // in progress
  return (mediaInFlight[channelId] = (async () => {
    try { const list = await api(`/api/channels/${channelId}/media`); S.media[channelId] = Object.fromEntries(list.map((m) => [m.id, m])); }
    catch { S.media[channelId] = {}; }
    delete mediaInFlight[channelId];
    return S.media[channelId];
  })());
}
const thumbOf = (channelId, mediaId) => { const m = S.media[channelId]?.[mediaId]; return m ? (m.thumbnail_url || m.media_url || '') : ''; };

/* ---------- structure ---------- */
const setHtml = (el, html) => { if (el._h === html) return false; el.innerHTML = html; el._h = html; return true; };
function chrome() {
  const cur = S.brand === 'all' ? null : S.brands.find((b) => String(b.id) === String(S.brand));
  const bsHtml = `<button class="brandbtn" id="bb" aria-expanded="false" aria-controls="bm"><span class="bavatar">${esc(cur ? cur.name[0].toUpperCase() : '◎')}</span><span class="name" ${cur ? 'translate="no"' : ''}>${esc(cur ? cur.name : 'All brands')}</span>${ic('chev')}</button>
    <div class="brandmenu" id="bm"><button data-b="all" class="${S.brand === 'all' ? 'on' : ''}"><span class="bavatar">◎</span>All brands</button>${S.brands.map((b) => `<button data-b="${b.id}" class="${String(b.id) === String(S.brand) ? 'on' : ''}"><span class="bavatar">${esc(b.name[0].toUpperCase())}</span><span translate="no">${esc(b.name)}</span></button>`).join('')}</div>`;
  if (setHtml($('#brandsw'), bsHtml)) {
  $('#bb').onclick = (e) => { e.stopPropagation(); setBrandMenu(!$('#bm').classList.contains('open')); };
  $('#bm').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; S.brand = b.dataset.b; store.set('brand', S.brand); setBrandMenu(false); render(); };
  }
  setHtml($('#nav'),  TABS.map(([k, l, i]) => `<a href="#/${k}" class="${S.tab === k ? 'on' : ''}" ${S.tab === k ? 'aria-current="page"' : ''}>${ic(i)}${l}</a>`).join(''));
  setHtml($('#sidefoot'), '<form method="post" action="/logout"><button class="btn sec sm" type="submit">Sign out</button></form>');
  $('#menu-toggle').setAttribute('aria-label', T('Navigation'));
  $('#nav').setAttribute('aria-label', T('Navigation'));
}
function setBrandMenu(open) {
  $('#bm')?.classList.toggle('open', open);
  $('#bb')?.setAttribute('aria-expanded', String(open));
}
function setMobileMenu(open) {
  $('.side').classList.toggle('nav-open', open);
  $('#menu-toggle').setAttribute('aria-expanded', String(open));
}
$('#menu-toggle').onclick = () => setMobileMenu(!$('.side').classList.contains('nav-open'));
$('#nav').addEventListener('click', (event) => { if (event.target.closest('a')) setMobileMenu(false); });
$('.skip-link').onclick = (event) => { event.preventDefault(); $('#main').focus(); };
document.addEventListener('click', () => setBrandMenu(false));
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && $('#bm')?.classList.contains('open')) {
    setBrandMenu(false);
    $('#bb').focus();
  } else if (event.key === 'Escape' && $('.side').classList.contains('nav-open') && matchMedia('(max-width: 900px)').matches && !document.querySelector('dialog[open]')) {
    setMobileMenu(false);
    $('#menu-toggle').focus();
  }
});
document.addEventListener('click', async (e) => {
  if (!e.target.closest('#resume-sending')) return;
  const ok = await confirmBox(T('Resume sending'), T('Meta restricted this account. Review it in Meta (Account Status) before resuming. Sending again too early can make the restriction longer.'), T('Resume sending'));
  if (!ok) return;
  try { S.poller = await api('/api/sending/resume', 'POST', { confirm: 'RESUME' }); toast(T('Sending resumed')); render(); } catch (err) { toast(err.message, 'bad'); }
});

const pollPill = () => {
  const p = S.poller; if (!p) return '';
  if (!p.enabled) return '<span class="pill"><i class="dot off"></i>Comment reading · off</span>';
  if (p.restricted) return `<span class="pill" title="${esc(p.restricted)}"><i class="dot warn"></i>${T('Sending stopped by Meta')}</span><button class="btn sec" id="resume-sending">${T('Resume sending')}</button>`;
  if (p.pausedUntil) return `<span class="pill" title="${esc(p.pauseReason)}"><i class="dot warn"></i>Paused by Meta until ${esc(new Date(p.pausedUntil).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))}</span>`;
  if (p.lastError) return `<span class="pill" title="${esc(p.lastError)}"><i class="dot bad"></i>Comment reading · error</span>`;
  return '<span class="pill"><i class="dot"></i>Comment reading · on</span>';
};
const header = (title, extra = '') => `<div class="top "><h1>${esc(title)}</h1>${extra}${pollPill()}</div>`;
const noAccount = () => `<div class="card empty "><div class="big">Connect your first Instagram account or Facebook Page</div><p>Connect a professional account to start creating automations.</p><a class="btn pri" href="#/conexion">Go to Meta connection</a></div>`;

/* ---------- Home ---------- */
// All dashboard text goes through T(): it only changes what the panel shows, never your data or messages.
S.range = ['today', '7', '30'].includes(store.get('range', '7')) ? store.get('range', '7') : '7';
const RANGES = [['today', 'Today'], ['7', '7 days'], ['30', '30 days']];
const periodo = () => ({ today: T('today'), 7: T('the last 7 days'), 30: T('the last 30 days') }[S.range]);
const rangePills = () => `<div class="seg " id="rangeseg" role="tablist">${RANGES.map(([k, label]) => `<button type="button" data-r="${k}" class="${S.range === k ? 'on' : ''}" translate="no">${T(label)}</button>`).join('')}</div>`;
const bindRange = (fn) => document.querySelectorAll('#rangeseg button').forEach((b) => (b.onclick = () => { S.range = b.dataset.r; store.set('range', S.range); fn(); }));
const loadAnalytics = () => api(`/api/analytics?range=${S.range}${S.brand === 'all' ? '' : `&brand=${S.brand}`}`);
const fmtDur = (s) => (s == null ? '—' : s < 60 ? `${Math.round(s)} s` : s < 3600 ? `${Math.round(s / 60)} min` : `${(s / 3600).toFixed(1)} h`);
const num = (n) => Number(n ?? 0).toLocaleString(LANG);
const DAYS = () => [T('Sun'), T('Mon'), T('Tue'), T('Wed'), T('Thu'), T('Fri'), T('Sat')];
const DAYS_LONG = () => [T('Sunday'), T('Monday'), T('Tuesday'), T('Wednesday'), T('Thursday'), T('Friday'), T('Saturday')];
const hour12 = (h) => (LANG === 'en' ? `${h % 12 || 12} ${h < 12 ? 'am' : 'pm'}` : `${h}:00`);
const niceTop = (m) => [5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000].find((s) => s >= m) ?? Math.ceil(m / 1000) * 1000;
const curve = (p) => p.map((q, i) => (i === 0 ? `M${q[0]},${q[1]}` : `C${(p[i - 1][0] + q[0]) / 2},${p[i - 1][1]} ${(p[i - 1][0] + q[0]) / 2},${q[1]} ${q[0]},${q[1]}`)).join(' ');
let gid = 0;

function areaChart(series, keys) { // keys: [[field, color1, color2, label]]
  const W = 760, H = 250, pl = 38, pr = 12, pt = 16, pb = 28, id = ++gid;
  const top = niceTop(Math.max(5, ...series.map((s) => Math.max(...keys.map((k) => s[k[0]])))));
  const x = (i) => pl + ((W - pl - pr) * i) / Math.max(1, series.length - 1), y = (v) => H - pb - ((H - pb - pt) * v) / top;
  let g = `<defs>${keys.map((k, i) => `<linearGradient id="ar${id}_${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${k[1]}" stop-opacity=".55"/><stop offset="1" stop-color="${k[1]}" stop-opacity="0"/></linearGradient>`).join('')}</defs>`;
  for (let i = 0; i <= 2; i++) { const yy = y((top * i) / 2); g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="#dedbd2"/><text x="${pl - 8}" y="${yy + 4}" text-anchor="end" fill="#63685d" font-size="12">${top * i / 2}</text>`; }
  series.forEach((s, i) => { if (i % 7 === 0 || (i === series.length - 1 && (series.length - 1) % 7 >= 3)) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" fill="#63685d" font-size="12">${s.date.slice(8)}/${s.date.slice(5, 7)}</text>`; });
  keys.forEach((k, i) => {
    const pts = series.map((s, j) => [x(j), y(s[k[0]])]);
    g += `<path d="${curve(pts)} L${pts.at(-1)[0]},${H - pb} L${pts[0][0]},${H - pb} Z" fill="url(#ar${id}_${i})"/><path d="${curve(pts)}" fill="none" stroke="${k[1]}" stroke-width="3" stroke-linecap="round"/>`;
    const lp = pts.at(-1); g += `<circle cx="${lp[0]}" cy="${lp[1]}" r="5" fill="${k[1]}" stroke="#fff" stroke-width="2"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${T('Chart of the last 30 days')}">${g}</svg>`;
}
function sparkline(vals, color = '#20584b', w = 150, h = 46) {
  const id = ++gid, max = Math.max(1, ...vals), pts = vals.map((v, i) => [(w * i) / Math.max(1, vals.length - 1), h - 4 - ((h - 10) * v) / max]);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="sp${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".5"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${curve(pts)} L${w},${h} L0,${h} Z" fill="url(#sp${id})"/><path d="${curve(pts)}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round"/></svg>`;
}
function donut(parts, center, size = 124) { // parts: [{v, color}]
  const r = 44, C = 2 * Math.PI * r, tot = parts.reduce((a, p) => a + p.v, 0) || 1; let off = 0;
  const segs = parts.filter((p) => p.v > 0).map((p) => { const len = (C * p.v) / tot, s = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${p.color}" stroke-width="14" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`; off += len; return s; }).join('');
  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}" role="img"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#e6e3db" stroke-width="14"/>${segs}<text x="60" y="66" text-anchor="middle" font-size="19" font-weight="800" fill="#262921">${center}</text></svg>`;
}
function heatmap(grid) {
  const max = Math.max(1, ...grid.flat()), names = DAYS(), order = [1, 2, 3, 4, 5, 6, 0];
  return order.map((d) => `<div class="hm-row"><span class="hm-l">${names[d]}</span>${grid[d].map((n, h) => `<i style="background:rgba(32,88,75,${n ? 0.14 + (0.86 * n) / max : 0.06})" title="${names[d]} ${hour12(h)} · ${n}"></i>`).join('')}</div>`).join('')
    + `<div class="hm-row hm-ax"><span class="hm-l"></span>${Array.from({ length: 24 }, (_, h) => `<span>${h % 6 === 0 ? h : ''}</span>`).join('')}</div>`;
}
function funnelSvg(f) {
  const lab = [T('Comments with keyword'), T('DMs sent'), T('Emails captured'), T('Resources delivered')];
  const col = [['#20584b', '#20584b'], ['#426b78', '#426b78'], ['#69618a', '#69618a'], ['#825b39', '#825b39']];
  const max = Math.max(1, ...f.map((s) => s.n)), W = 1000, H = 215, sw = 250, mid = 82, hs = f.map((s) => Math.max(0.3, s.n / max) * 140), id = ++gid;

// Paints the main content. In "quiet" mode (automatic refresh) it does not wipe the page: it compares with what is already shown and only
// changes the parts that differ, without replaying the entry animations. That is why it does not flicker.
const stripRise = (h) => h.replace(/ rise(?=["\s])/g, '');
function morphKids(o, n) {
  const a = [...o.childNodes], b = [...n.childNodes];
  for (let i = 0; i < b.length; i++) {
    const x = a[i], y = b[i];
    if (!x) { o.appendChild(y); continue; }
    if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName) { o.replaceChild(y, x); continue; }
    if (x.nodeType === 3) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; continue; }
    if (x.nodeType !== 1) continue;
    for (const at of [...x.attributes]) if (!y.hasAttribute(at.name) && at.name !== 'data-ok') x.removeAttribute(at.name);
    for (const at of [...y.attributes]) if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value);
    if (x.hasAttribute('data-th') && x.dataset.ok && x.dataset.m === y.dataset.m) continue; // the cover already loaded: leave it alone
    morphKids(x, y);
  }
  for (let i = a.length - 1; i >= b.length; i--) o.removeChild(a[i]);
}
function paint(html, quiet) {
  const main = $('#main'), h = stripRise(html);
  if (quiet && S.lastHtml != null) {
    if (S.lastHtml === h) return false;
    try {
      const tpl = document.createElement('template'); tpl.innerHTML = h;
      if (LANG === 'en') tpl.content.childNodes.forEach(trNode);
      morphKids(main, tpl.content); S.lastHtml = h; return true;
    } catch { /* if anything fails, draw the whole page */ }
  }
  main.innerHTML = quiet ? h : html; S.lastHtml = h; return true;
}

/* Puts cards in the shortest column so columns stay balanced (no dead space); one column on narrow screens. */
let masonryOnResize = null;
function shortest(cols) { let t = cols[0]; for (const c of cols) if (c.offsetHeight < t.offsetHeight) t = c; return t; }
function masonry(box) {
  if (!box) return;
  const cards = [...box.children], wide = () => innerWidth > 1000;
  const place = () => {
    const cols = Array.from({ length: wide() ? 2 : 1 }, () => Object.assign(document.createElement('div'), { className: 'mcol' }));
    box.style.setProperty('--n', cols.length); box.replaceChildren(...cols);
    for (const c of cards) shortest(cols).appendChild(c);
  };
  place();
  let was = wide();
  removeEventListener('resize', masonryOnResize);
  masonryOnResize = () => { if (!box.isConnected) return removeEventListener('resize', masonryOnResize); if (wide() !== was) { was = wide(); place(); } };
  addEventListener('resize', masonryOnResize);
}

    if (g('f_scope').value === 'one' && !b.media_id) return toast('Pick a reel, or switch to "All posts and reels"', 'bad');
    if (b.match_mode !== 'any' && !b.keywords.length) return toast('Add at least one keyword', 'bad');
    if (b.mode === 'email' && !String(b.ask_text || '').trim()) return toast('Write the first DM that asks for the email', 'bad');
    if (!b.dm_text.trim()) return toast('Write the message with the resource', 'bad');
    if (!b.name) b.name = (b.keywords[0] ? `Palabra "${b.keywords[0]}"` : 'Automation') + (b.media_id ? '' : ' · todos');
    g('save').disabled = true;
    try { await api(b.id ? `/api/automations/${b.id}` : '/api/automations', b.id ? 'PUT' : 'POST', b); toast('Saved'); S.editing = null; await loadBase(); render(); }
    catch (e) { toast(e.message, 'bad'); }
    finally { const save = g('save'); if (save) save.disabled = false; }
  };
  if (a.id) {
    g('dup').onclick = async () => {
      try {
        const { id } = await api(`/api/automations/${a.id}/duplicate`, 'POST', {});
        await loadBase(); toast(T('Duplicated. The copy is paused until you activate it.'));
        editAuto(id);
      } catch (err) { toast(err.message, 'bad'); }
    };
    g('del').onclick = async () => { if (await confirmBox('Delete this automation?', 'Its run history is deleted too. This cannot be undone.')) { await api(`/api/automations/${a.id}`, 'DELETE'); toast('Deleted'); S.editing = null; await loadBase(); render(); } };
    g('sim').onclick = async () => { readForm(); try { const r = await api('/api/simulate', 'POST', { channel_id: a.channel_id, text: a.keywords[0] || 'hola', media_id: a.media_id || undefined });
      g('simout').innerHTML = `<div class="simout">${r.matched.length ? '<span>It triggered with a test comment</span> ("<span translate="no">' + esc(a.keywords[0] || 'hola') + '</span>"). <span>This is what would be sent:</span>\n\n' + r.actions.map((x) => `• <span>${x.action === 'public_reply' ? 'Public reply' : 'DM'}</span>: <span translate="no">${esc(x.text)}</span>${x.button ? ` [<span>button</span> <span translate="no">${esc(x.button.title)} → ${esc(x.button.url)}</span>]` : ''}`).join('\n') + '\n\n<span>Nothing was sent to Instagram. The test uses what is already saved.</span>' : '<span>It did not trigger with that test comment. Save your changes and test again.</span>'}</div>`; } catch (e) { toast(e.message, 'bad'); } };
  }
  syncMode(); paintChips(); paintReels(); paintPhone();
}

/* ---------- Activity / Contacts ---------- */
async function viewActividad(opts = {}) {
  const quiet = !!opts.quiet;
  if (!S.channels.length) return $('#main').innerHTML = header('Activity') + noAccount();
  const [runs, ev] = await Promise.all([api('/api/runs'), api('/api/events')]);
  const rs = runs.filter((r) => inScope(r.brand_id)); const f = S.afilter || 'all';
  const waiting = (r) => r.status === 'pending' || r.capture_status === 'waiting' || r.capture_status === 'got_email';
  const shown = rs.filter((r) => f === 'all' || (f === 'ok' ? r.status === 'done' && !waiting(r) : f === 'bad' ? r.status === 'error' || r.capture_status === 'failed' : waiting(r)));
  if (quiet && S.tab !== 'actividad') return;
  const html = header('Activity') + `
  <div class="filters ">${[['all', 'All'], ['ok', 'Sent'], ['wait', 'Waiting'], ['bad', 'Errors']].map(([k, l]) => `<button class="fpill ${f === k ? 'on' : ''}" data-f="${k}">${l}</button>`).join('')}</div>
  <div class="grid activity-layout">
    <div class="card"><h2>Replies</h2>${shown.length ? `<div class="table-scroll" tabindex="0"><table class="tbl"><thead><tr><th>User</th><th>Status</th><th class="hide-s">Comment</th><th class="hide-s">Automation</th><th class="hide-s">When</th></tr></thead><tbody>
      ${shown.map((r) => `<tr><td><div class="who" translate="no">${avatar(r.username)}@${esc(r.username || '—')}</div></td><td>${stChip(r)}${r.status === 'error' ? `<div class="mute" style="margin-top:4px;max-width:260px" translate="no">${esc(r.error)}</div>` : ''}</td><td class="hide-s" translate="no">${esc(r.comment_text)}</td><td class="hide-s" translate="no">${esc(r.automation)}</td><td class="hide-s mute">${esc(ago(r.created_at))}</td></tr>`).join('')}</tbody></table></div>` : '<p class="mute">Nothing here yet.</p>'}</div>
    <div class="card"><h2>Log</h2>${ev.slice(0, 14).map((e) => `<div style="display:flex;gap:10px;margin:0 0 12px"><i class="dot ${e.kind === 'error' ? 'bad' : e.kind === 'warn' ? 'warn' : ''}" style="margin-top:6px"></i><div><div style="font-size:13.5px" translate="no">${esc(trEvent(e.note))}</div><div class="mute">${esc(ago(e.ts))}</div></div></div>`).join('') || '<p class="mute">No events.</p>'}</div>
  </div>`;
  if (!paint(html, quiet)) return;
  document.querySelectorAll('.fpill').forEach((b) => b.onclick = () => { S.afilter = b.dataset.f; viewActividad(); });
}
async function viewContactos() {
  const cs = (await api('/api/contacts')).filter((c) => inScope(c.brand_id));
  const nEmails = cs.filter((c) => c.email).length;
  const csv = '/api/export/emails.csv' + (S.brand === 'all' ? '' : `?brand=${S.brand}`);
  $('#main').innerHTML = header('Contacts', `<a class="btn pri " href="${csv}" download title="Download the captured emails as a CSV file (Excel or Google Sheets)">Export emails (${nEmails})</a>`) + `<div class="card "><h2>${ic('users')}${cs.length} contact${cs.length === 1 ? '' : 's'}</h2>${cs.length ? `<div class="contact-search"><label class="f" for="contact-query">Search contacts</label><input id="contact-query" type="text" autocomplete="off"></div><div class="table-scroll" tabindex="0"><table class="tbl"><thead><tr><th>User</th><th>Email</th><th class="hide-s">Tags</th><th class="hide-s">First seen</th><th class="hide-s">Last</th></tr></thead><tbody>
    ${cs.map((c) => `<tr data-contact><td><div class="who" translate="no">${avatar(c.username)}@${esc(c.username || c.external_id)}</div></td><td>${c.email ? esc(c.email) : '<span class="mute">—</span>'}</td><td class="hide-s">${c.tags.map((t) => `<span class="chip" translate="no">${esc(t)}</span>`).join('') || '<span class="mute">—</span>'}</td><td class="hide-s mute">${esc(ago(c.first_seen))}</td><td class="hide-s mute">${esc(ago(c.last_interaction))}</td></tr>`).join('')}</tbody></table></div><p class="mute" id="contact-no-results" role="status" hidden>No matching contacts.</p>` : '<p class="mute">People who receive your messages appear here, with their tags and email if they gave one.</p>'}</div>`;
  const query = $('#contact-query');
  if (query) {
    const rows = [...document.querySelectorAll('[data-contact]')];
    const searchable = cs.map((contact) => [contact.username, contact.external_id, contact.email, ...contact.tags].join(' ').toLowerCase());
    query.oninput = () => {
      const value = query.value.trim().replace(/^@/, '').toLowerCase();
      let results = 0;
      rows.forEach((row, index) => { row.hidden = !searchable[index].includes(value); if (!row.hidden) results++; });
      $('#contact-no-results').hidden = results !== 0;
    };
  }
}

/* ---------- Meta connection ---------- */
async function viewConexion() {
  const cfg = await api('/api/config');
  $('#main').innerHTML = header('Meta connection') + `
  <div class="grid g-2">
   <div>
    <div class="card "><h2>${ic('tag')}Brands</h2>
      ${S.brands.map((b) => `<div class="bars-row" style="margin:10px 0"><span class="bavatar" style="background:var(--g-violet)">${esc(b.name[0].toUpperCase())}</span><span style="flex:1"><span translate="no">${esc(b.name)}</span><span class="mute"> · ${S.channels.filter((c) => c.brand_id === b.id).map((c) => '@' + esc(c.username)).join(', ') || T('No accounts')}</span></span><button class="btn del sm" data-db="${b.id}">Delete</button></div>`).join('') || '<p class="mute">Create your first brand.</p>'}
      <div class="inline-fields"><input type="text" id="bn" placeholder="Brand name (e.g. Acme)" aria-label="Brand name"><button class="btn sec" id="addb">${ic('plus')}Add</button></div></div>
    <div class="card mt"><h2>${ic('meta')}Accounts</h2>
      ${S.channels.map((c) => `<div class="bars-row" style="margin:10px 0">${avatar(c.username)}<span style="flex:1">@${esc(c.username)}<span class="mute"> · ${c.type === 'facebook' ? T('Facebook Page') : 'Instagram'} · <span translate="no">${esc(brandOf(c.id)?.name || '')}</span> · token ${c.token ? `<span translate="no">${esc(c.token)}</span>` : 'none'}</span></span><button class="btn del sm" data-dc="${c.id}">Remove</button></div>`).join('') || '<p class="mute">No accounts yet.</p>'}
      <details class="adv" style="margin-top:14px" ${S.channels.length ? '' : 'open'}><summary>Connect an account</summary>
        <p class="mute">Professional Instagram account or Facebook Page. Paste the ID and the system user token here (see docs/META-SETUP.md). The token is stored only on this computer.</p>
        <label class="f" for="cp">Platform</label><select id="cp"><option value="instagram">Instagram</option><option value="facebook">Facebook Page</option></select>
        <label class="f" for="cb" style="margin-top:12px">Brand</label><select id="cb">${S.brands.map((b) => `<option value="${b.id}" translate="no">${esc(b.name)}</option>`).join('')}</select>
        <label class="f" for="ci" id="cil" style="margin-top:12px">Instagram account ID (numbers only)</label><input type="text" id="ci" inputmode="numeric" placeholder="1784…">
        <label class="f" for="ct" style="margin-top:12px">Access token</label><textarea id="ct" rows="3" placeholder="EAA…" autocomplete="off"></textarea>
        <p style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" id="conn">Connect</button><button class="btn sec" id="demo">Create demo account</button></p></details></div>
   </div>
   <div>
    <div class="card"><h2>Comment delivery</h2><p>Polling interval <strong>${S.poller?.intervalSec || 60} s</strong></p>
      <details class="adv"><summary>Webhook configuration</summary><label class="f">Verify token</label><input type="text" readonly value="${esc(cfg.verify_token)}"><p class="mute">App Secret: ${cfg.app_secret_set ? 'set in .env' : 'not set'}</p></details></div>
   </div>
  </div>`;
  const reload = async () => { await loadBase(); render(); };
  $('#addb').onclick = async () => { const n = $('#bn').value.trim(); if (!n) return; try { await api('/api/brands', 'POST', { name: n }); toast('Brand created'); reload(); } catch (e) { toast(e.message, 'bad'); } };
  document.querySelectorAll('[data-db]').forEach((b) => b.onclick = async () => { if (await confirmBox('Delete the brand?', 'Its accounts, automations and contacts are deleted too.')) { await api('/api/brands/' + b.dataset.db, 'DELETE'); reload(); } });
  document.querySelectorAll('[data-dc]').forEach((b) => b.onclick = async () => { if (await confirmBox('Remove this account?', 'Its automations are deleted too.', 'Remove')) { await api('/api/channels/' + b.dataset.dc, 'DELETE'); reload(); } });
  $('#cp').onchange = () => { const fb = $('#cp').value === 'facebook'; $('#cil').textContent = fb ? T('Facebook Page ID (numbers only)') : T('Instagram account ID (numbers only)'); $('#ci').placeholder = fb ? '1000…' : '1784…'; };
  $('#conn').onclick = async () => { if (!S.brands.length) return toast('Create a brand first', 'bad'); try { const r = await api('/api/channels', 'POST', { platform: $('#cp').value, brand_id: $('#cb').value, token: $('#ct').value, ig_user_id: $('#ci').value }); toast(`Connected @${r.username}`); reload(); } catch (e) { toast(e.message, 'bad'); } };
  $('#demo').onclick = async () => { if (!S.brands.length) return toast('Create a brand first', 'bad'); await api('/api/channels', 'POST', { brand_id: $('#cb').value, demo: true }); reload(); };
}

/* ---------- Settings ---------- */
function viewAjustes() {
  const row = (title, desc, link) => `<div class="bars-row" style="align-items:flex-start;margin:14px 0"><span style="flex:1"><b>${title}</b><div class="mute">${desc}</div></span>${link ? `<a class="btn sec sm" href="${link}">Open section</a>` : ''}</div>`;
  $('#main').innerHTML = header('Settings') + `
  <div class="grid g-2">
    <div class="card "><h2>${ic('gear')}General</h2>
      <label class="f" for="interface-language">Interface language</label>
      <select id="interface-language">${(S.langs || [{ code: 'en', name: 'English' }]).map((l) => `<option value="${esc(l.code)}" ${LANG === l.code ? 'selected' : ''} translate="no">${esc(l.name)}</option>`).join('')}</select>
      <p class="mute" style="margin-top:14px">Only changes the language of the panel\'s menus, buttons and texts. It does not change your messages, replies or automations. It is remembered in this browser.</p></div>
    <div class="card "><h2>Where each setting lives</h2>
      ${row('Brands and accounts', 'Connect accounts, create and delete brands.', '#/conexion')}
      ${row('Messages and replies', 'They are edited inside each automation.', '#/automatizaciones')}
      ${row('Limits and reading intervals', 'They are changed in the .env file, then the program is restarted (HOURLY_CAP, POLL_SECONDS, DM_POLL_SECONDS).', '')}
      ${row('Panel password and App Secret', 'They live in the .env file. For security they are not edited from the web.', '')}
    </div>
  </div>`;
  $('#interface-language').onchange = (event) => setLang(event.target.value);
}

/* ---------- navigation ---------- */
const VIEWS = { inicio: viewInicio, automatizaciones: viewAutos, actividad: viewActividad, analisis: viewAnalisis, contactos: viewContactos, conexion: viewConexion, ajustes: viewAjustes };
async function render() {
  const t = (location.hash.replace('#/', '') || 'inicio'); S.tab = Object.hasOwn(VIEWS, t) ? t : 'inicio';
  if (S.tab !== 'automatizaciones') S.editing = null;
  chrome(); S.lastHtml = null;
  try { if (S.editing) await viewEditor(); else await VIEWS[S.tab](); }
  catch (e) { $('#main').innerHTML = header('Error') + `<div class="card"><div class="big" style="font-weight:800;font-size:18px">Something went wrong</div><p class="mute">${esc(e.message)}</p></div>`; }
}
window.addEventListener('hashchange', async () => { S.editing = null; await render(); window.scrollTo(0, 0); $('#main').focus({ preventScroll: true }); });
// Soft refresh every 20 s on Home and Activity (does not touch the editor or forms)
setInterval(async () => { if (document.hidden || S.editing || !['inicio', 'actividad'].includes(S.tab)) return; try { S.poller = await api('/api/poller'); chrome(); await VIEWS[S.tab]({ quiet: true }); } catch {} }, 20000);
(async () => { try { S.langs = await api('/api/langs').catch(() => null); await loadLang(LANG); await loadBase(); } catch (e) { toast(e.message, 'bad'); } render(); })();
</script>
</body>
