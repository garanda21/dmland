<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMLand</title>
<style>
  :root {
    /* Tokens: change these values to restyle the dashboard */
    --font: ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
    --ink: #f6f1ea; --ink-2: #c9bfb4; --ink-3: #8f857b;
    --glass: rgba(255,255,255,.055); --glass-2: rgba(255,255,255,.09); --line: rgba(255,255,255,.12);
    --r-lg: 24px; --r-md: 16px; --r-sm: 12px;
    --amber: #f4b13f; --orange: #f0693a; --violet: #8f6bf2; --indigo: #6b3fd6; --rose: #e8678a; --pink: #d63f8a; --sky: #58b0f5; --blue: #5b7cf2;
    --g-amber: linear-gradient(135deg, #f6b73f, #f0693a);
    --g-violet: linear-gradient(135deg, #9a76f5, #6a3fd4);
    --g-rose: linear-gradient(135deg, #ee6f8c, #d63f8a);
    --g-blue: linear-gradient(135deg, #5ab4f6, #5b78f0);
    --ok: #4fd08a; --warn: #f4b13f; --bad: #ef5b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--font); color: var(--ink); font-size: 15px; line-height: 1.45;
    background:
      radial-gradient(1100px 700px at 95% 0%, #f9bf55 0%, transparent 60%),
      radial-gradient(900px 700px at 100% 100%, #7b5ad6 0%, transparent 60%),
      radial-gradient(900px 700px at 0% 100%, #c9794b 0%, transparent 60%),
      #6a4338;
    background-attachment: fixed;
  }
  .stage { padding: 24px; min-height: 100vh; }
  .window {
    display: grid; grid-template-columns: 252px 1fr; min-height: calc(100vh - 48px);
    border-radius: 30px; overflow: hidden; border: 1px solid rgba(255,255,255,.28);
    background: linear-gradient(135deg, rgba(23,17,21,.94), rgba(34,21,32,.9));
    box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.2);
    position: relative;
  }
  .window::before { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(700px 420px at 85% -5%, rgba(244,177,63,.16), transparent 70%), radial-gradient(600px 500px at 100% 100%, rgba(143,107,242,.14), transparent 70%); }

  /* ---------- sidebar ---------- */
  .side { background: #09070a; padding: 22px 16px; display: flex; flex-direction: column; gap: 18px; position: relative; z-index: 3; border-right: 1px solid rgba(255,255,255,.06); }
  .logo { display: flex; align-items: center; gap: 11px; font-weight: 800; font-size: 19px; letter-spacing: -.3px; padding: 2px 6px; }
  .logo svg { width: 38px; height: 38px; flex: none; }
  .brandsw { position: relative; }
  .brandbtn { width: 100%; display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 16px; border: 0; cursor: pointer; font: inherit; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #58b0f5, #6d7df2); box-shadow: 0 8px 24px rgba(88,176,245,.25); }
  .brandbtn .name { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brandbtn svg { width: 18px; height: 18px; flex: none; }
  .bavatar { width: 28px; height: 28px; border-radius: 50%; background: #0d0a0e; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #fff; flex: none; }
  .brandmenu { position: absolute; left: 0; right: 0; top: calc(100% + 8px); background: #16111a; border: 1px solid var(--line); border-radius: 16px; padding: 6px; z-index: 20; display: none; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .brandmenu.open { display: block; }
  .brandmenu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 11px; border: 0; background: none; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; text-align: left; }
  .brandmenu button:hover, .brandmenu button.on { background: var(--glass-2); }
  nav.menu { display: flex; flex-direction: column; gap: 4px; }
  nav.menu a { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 14px; color: var(--ink-2); font-weight: 600; text-decoration: none; cursor: pointer; transition: background .15s, color .15s; }
  nav.menu a:hover { background: var(--glass); color: var(--ink); }
  nav.menu a.on { background: linear-gradient(135deg, #58b0f5, #6d85f3); color: #fff; box-shadow: 0 8px 22px rgba(88,176,245,.25); }
  nav.menu svg { width: 20px; height: 20px; flex: none; }
  .sidefoot { margin-top: auto; font-size: 12.5px; color: var(--ink-3); padding: 0 8px; }

  /* ---------- main ---------- */
  main { position: relative; z-index: 2; padding: 26px 30px 40px; min-width: 0; }
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.8px; flex: 1; min-width: 160px; }
  .pill { display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 999px; background: rgba(255,255,255,.09); border: 1px solid var(--line); font-weight: 600; font-size: 13.5px; color: var(--ink); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(79,208,138,.18); flex: none; }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 4px rgba(244,177,63,.18); } .dot.bad { background: var(--bad); box-shadow: 0 0 0 4px rgba(239,91,107,.18); } .dot.off { background: #777; box-shadow: none; }
  .iconbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--glass-2); border: 1px solid var(--line); color: var(--ink); cursor: pointer; }
  .iconbtn svg { width: 19px; height: 19px; }

  .card { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px 22px; backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); min-width: 0; }
  .card h2 { margin: 0 0 14px; font-size: 16.5px; font-weight: 700; display: flex; align-items: center; gap: 10px; letter-spacing: -.2px; }
  .card h2 svg { width: 19px; height: 19px; color: var(--ink-3); }
  .grid { display: grid; gap: 18px; } .g4 { grid-template-columns: repeat(4, 1fr); } .g-main { grid-template-columns: 1.9fr 1fr; } .g-2 { grid-template-columns: 1.5fr 1fr; }
  .mt { margin-top: 18px; }

  .kpi { border-radius: var(--r-lg); padding: 18px 20px; color: #fff; position: relative; overflow: hidden; box-shadow: 0 14px 34px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.35); }
  .kpi::after { content: ''; position: absolute; inset: 0; background: radial-gradient(240px 120px at 20% 0%, rgba(255,255,255,.22), transparent 70%); pointer-events: none; }
  .kpi .ic { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; float: left; margin-right: 12px; }
  .kpi .ic svg { width: 20px; height: 20px; }
  .kpi .lb { font-size: 14px; font-weight: 600; opacity: .95; padding-top: 2px; min-height: 40px; }
  .kpi .num { font-size: 40px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.1; margin-top: 10px; clear: both; }
  .k-amber { background: var(--g-amber); } .k-violet { background: var(--g-violet); } .k-rose { background: var(--g-rose); } .k-blue { background: var(--g-blue); }

  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 0 10px 10px; letter-spacing: .3px; }
  .tbl td { padding: 11px 10px; border-top: 1px solid rgba(255,255,255,.07); font-size: 14px; vertical-align: middle; }
  .tbl td.mute { white-space: nowrap; }
  .who { display: flex; align-items: center; gap: 11px; font-weight: 600; }
  .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 800; color: #fff; flex: none; }
  .st { display: inline-flex; align-items: center; gap: 8px; padding: 5px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid transparent; }
  .st::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .st.ok { color: var(--ok); background: rgba(79,208,138,.12); border-color: rgba(79,208,138,.25); }
  .st.warn { color: var(--warn); background: rgba(244,177,63,.12); border-color: rgba(244,177,63,.25); }
  .st.bad { color: var(--bad); background: rgba(239,91,107,.12); border-color: rgba(239,91,107,.25); }
  .mute { color: var(--ink-3); font-size: 13px; }

  .bars-row { display: flex; align-items: center; gap: 14px; margin: 14px 0; font-weight: 600; }
  .bars-row .nm { width: 78px; flex: none; } .bars-row .tr { flex: 1; height: 10px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; } .bars-row .tr i { display: block; height: 100%; border-radius: 99px; } .bars-row .pc { width: 46px; text-align: right; color: var(--ink-2); }

  .btn { display: inline-flex; align-items: center; gap: 9px; padding: 11px 22px; border-radius: 999px; border: 1px solid transparent; font: inherit; font-weight: 700; cursor: pointer; color: #fff; transition: transform .12s, filter .15s; white-space: nowrap; }
  .btn:hover { filter: brightness(1.08); } .btn:active { transform: scale(.98); }
  .btn.pri { background: linear-gradient(100deg, #f6a93b, #e0587a 55%, #8f6bf2); box-shadow: 0 10px 26px rgba(224,88,122,.3); }
  .btn.sec { background: var(--glass-2); border-color: var(--line); }
  .btn.del { background: rgba(239,91,107,.12); border-color: rgba(239,91,107,.3); color: #ff8d99; }
  .btn.sm { padding: 7px 14px; font-size: 13px; }
  .btn svg { width: 17px; height: 17px; }
  .filters { display: flex; gap: 9px; margin-bottom: 18px; flex-wrap: wrap; }
  .fpill { padding: 8px 20px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--ink-2); font: inherit; font-weight: 600; cursor: pointer; }
  .fpill.on { background: #f6e7c0; color: #1a1410; border-color: transparent; }

  /* automation cards */
  .acards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; }
  .acard { display: flex; gap: 16px; padding: 16px; border-radius: var(--r-lg); border: 1px solid var(--line); cursor: pointer; position: relative; overflow: hidden; transition: transform .15s, border-color .15s; min-height: 190px; }
  .acard:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.28); }
  .acard.c0 { background: linear-gradient(135deg, rgba(244,177,63,.16), rgba(255,255,255,.04)); } .acard.c1 { background: linear-gradient(135deg, rgba(143,107,242,.2), rgba(255,255,255,.04)); } .acard.c2 { background: linear-gradient(135deg, rgba(232,103,138,.2), rgba(255,255,255,.04)); }
  .thumb { width: 104px; height: 166px; border-radius: 16px; flex: none; background: var(--g-violet) center/cover; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,.2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .play { position: absolute; inset: 0; display: grid; place-items: center; }
  .thumb .play span { width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,.5); display: grid; place-items: center; backdrop-filter: blur(4px); }
  .thumb .play svg { width: 16px; height: 16px; color: #fff; margin-left: 2px; }
  .acard .info { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .acard h3 { margin: 4px 0 10px; font-size: 18px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; }
  .chip { display: inline-block; padding: 4px 13px; border-radius: 999px; background: rgba(143,107,242,.35); border: 1px solid rgba(180,160,255,.35); font-size: 13px; font-weight: 600; margin: 0 6px 6px 0; }
  .acard .meta { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--ink-2); font-weight: 600; font-size: 14px; }
  .acard .meta svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; }
  .newcard { border: 2px dashed rgba(255,255,255,.22); border-radius: var(--r-lg); display: grid; place-items: center; min-height: 190px; color: var(--ink-2); font-weight: 700; cursor: pointer; background: transparent; font-family: inherit; font-size: 16px; }
  .newcard:hover { border-color: rgba(255,255,255,.4); color: var(--ink); }
  .newcard .plus { width: 52px; height: 52px; border-radius: 50%; background: var(--glass-2); display: grid; place-items: center; margin: 0 auto 10px; } .newcard .plus svg { width: 24px; height: 24px; }
  .tgl { width: 46px; height: 26px; border-radius: 99px; background: rgba(255,255,255,.22); position: relative; cursor: pointer; border: 0; flex: none; transition: background .2s; }
  .tgl::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .tgl.on { background: #4aa8f5; } .tgl.on::after { transform: translateX(20px); }

  /* editor */
  .editor { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); gap: 22px; align-items: start; }
  .step { margin-bottom: 18px; } .step > .lbl { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 10px; font-size: 15.5px; }
  .step .n { width: 24px; height: 24px; border-radius: 50%; background: var(--g-amber); display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #1a1410; }
  input[type=text], input[type=url], input[type=number], textarea, select { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(0,0,0,.28); color: var(--ink); font: inherit; outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus, textarea:focus, select:focus { border-color: rgba(88,176,245,.7); box-shadow: 0 0 0 3px rgba(88,176,245,.18); }
  select option { background: #1b1520; color: var(--ink); }
  textarea { resize: vertical; min-height: 92px; }
  label.f { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-3); margin: 0 0 6px 2px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .reels { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px; }
  .reel { width: 78px; height: 124px; border-radius: 13px; flex: none; position: relative; cursor: pointer; border: 2px solid transparent; overflow: hidden; background: var(--g-violet); }
  .reel img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .reel.sel { border-color: #5ab4f6; box-shadow: 0 0 0 3px rgba(90,180,246,.3); }
  .reel .ck { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: #4aa8f5; display: none; place-items: center; } .reel.sel .ck { display: grid; } .reel .ck svg { width: 13px; height: 13px; color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; border-radius: 14px; border: 1px solid var(--line); background: rgba(0,0,0,.28); align-items: center; }
  .chips .chip { margin: 0; display: inline-flex; align-items: center; gap: 8px; } .chips .chip b { cursor: pointer; opacity: .7; font-weight: 800; } .chips .chip b:hover { opacity: 1; }
  .chips input { flex: 1; min-width: 120px; border: 0; background: transparent; padding: 6px 6px; box-shadow: none; }
  details.adv { border-top: 1px solid var(--line); padding-top: 14px; } details.adv summary { cursor: pointer; font-weight: 700; color: var(--ink-2); margin-bottom: 12px; }
  .preview { position: sticky; top: 20px; }
  .phone { width: 100%; max-width: 330px; margin: 6px auto 0; border-radius: 42px; padding: 10px; background: #0b0b0d; border: 1px solid rgba(255,255,255,.25); box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  .screen { border-radius: 33px; overflow: hidden; background: #f7f7f8; color: #111; min-height: 520px; display: flex; flex-direction: column; font-size: 13.5px; }
  .ig-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px; background: #fff; font-weight: 800; font-size: 17px; }
  .ig-post { height: 150px; background: var(--g-violet) center/cover; }
  .ig-c { display: flex; gap: 10px; padding: 11px 14px 0; background: #fff; } .ig-c.r { padding-left: 46px; padding-bottom: 12px; }
  .ig-c .a { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 12px; flex: none; }
  .ig-c b { font-weight: 700; } .ig-c small { display: block; color: #8a8a8f; margin-top: 2px; }
  .dm { margin-top: auto; background: #fff; border-top-left-radius: 22px; border-top-right-radius: 22px; box-shadow: 0 -8px 24px rgba(0,0,0,.12); padding: 12px 14px 14px; }
  .dm .hd { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 12px; } .dm .hd small { display: block; font-weight: 500; color: #8a8a8f; }
  .bubble { background: #efeff1; border-radius: 18px; padding: 10px 13px; max-width: 92%; white-space: pre-wrap; word-break: break-word; }
  [hidden] { display: none !important; }
  .seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; background: rgba(0,0,0,.3); border: 1px solid var(--line); flex-wrap: wrap; }
  .seg button { padding: 9px 18px; border-radius: 999px; border: 0; background: none; color: var(--ink-2); font: inherit; font-weight: 700; cursor: pointer; }
  .seg button.on { background: var(--g-amber); color: #1a1410; }
  .bubble { margin-bottom: 8px; } .bubble.me { margin-left: auto; background: #3797f0; color: #fff; }
  .st.mute { color: var(--ink-3); background: rgba(255,255,255,.06); border-color: var(--line); }
  .linkcard { margin-top: 8px; border-radius: 14px; background: #fff; border: 1px solid #e3e3e6; padding: 10px 12px; max-width: 92%; font-weight: 700; } .linkcard small { display: block; color: #8a8a8f; font-weight: 500; word-break: break-all; }
  .simout { background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; white-space: pre-wrap; font-size: 13px; margin-top: 12px; }

  .gauge { position: relative; display: grid; place-items: center; padding-top: 6px; } .gauge svg { width: 100%; max-width: 260px; } .gauge .gv { position: absolute; bottom: 12px; text-align: center; font-size: 30px; font-weight: 800; letter-spacing: -.8px; } .gauge .gv small { display: block; font-size: 13px; color: var(--ink-2); font-weight: 600; letter-spacing: 0; }

  .toast { position: fixed; right: 26px; bottom: 26px; z-index: 100; display: flex; flex-direction: column; gap: 10px; }
  .toast div { padding: 13px 18px; border-radius: 16px; background: #1c1520; border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(0,0,0,.5); font-weight: 600; max-width: 380px; animation: up .25s ease; }
  .toast .bad { border-color: rgba(239,91,107,.5); color: #ffb3bb; } .toast .good { border-color: rgba(79,208,138,.5); }
  .modal { position: fixed; inset: 0; z-index: 90; background: rgba(8,5,10,.6); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 20px; }
  .modal .box { background: #1a131d; border: 1px solid var(--line); border-radius: 24px; padding: 26px; max-width: 420px; width: 100%; box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: up .2s ease; } .modal h3 { margin: 0 0 8px; font-size: 18px; } .modal .act { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .empty { text-align: center; padding: 40px 20px; color: var(--ink-2); } .empty .big { font-size: 20px; font-weight: 800; color: var(--ink); margin-bottom: 6px; }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .rise { animation: up .45s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @media (prefers-reduced-motion: reduce) { .rise, .toast div, .modal .box { animation: none; } }

  .grid > *, .editor > * { min-width: 0; } body { overflow-x: hidden; }
  .anstack > .card, .masonry > .card { min-width: 0; }
  .masonry { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 18px; margin-top: 18px; align-items: start; }
  .mcol { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .mcol > .card { margin: 0; }
  @media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-main, .g-2, .editor { grid-template-columns: minmax(0, 1fr); } .preview { position: static; } }
  @media (max-width: 900px) {
    .kpi { padding: 14px; } .kpi .num { font-size: 30px; } .kpi .lb { font-size: 13px; min-height: 0; } .kpi .ic { width: 32px; height: 32px; margin-right: 8px; } .acards { grid-template-columns: minmax(0, 1fr); } .top { gap: 10px; } .pill { font-size: 12.5px; padding: 7px 12px; }
    .stage { padding: 0; } .window { grid-template-columns: minmax(0, 1fr); border-radius: 0; min-height: 100vh; border: 0; }
    .side { flex-direction: row; flex-wrap: wrap; align-items: center; padding: 14px; gap: 10px; } nav.menu { flex-direction: row; overflow-x: auto; width: 100%; order: 3; } nav.menu a { padding: 9px 13px; white-space: nowrap; } .sidefoot { display: none; } .brandsw { flex: 1; min-width: 150px; }
    main { padding: 18px 14px 40px; } .top h1 { font-size: 24px; } .row2 { grid-template-columns: 1fr; } .tbl .hide-s { display: none; }
  }

  /* ---- Home and Analytics ---- */
  .banner { display: flex; gap: 16px; align-items: center; padding: 20px 24px; border-radius: var(--r-lg); background: linear-gradient(110deg, rgba(246,183,63,.9), rgba(224,88,122,.85) 55%, rgba(143,107,242,.9)); color: #fff; box-shadow: 0 14px 34px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.35); }

const stripRise = (h) => h.replace(/ rise(?=["\s])/g, '');
function morphKids(o, n) {
  const a = [...o.childNodes], b = [...n.childNodes];
  for (let i = 0; i < b.length; i++) {
    const x = a[i], y = b[i];
    if (!x) { o.appendChild(y); continue; }
    if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName) { o.replaceChild(y, x); continue; }
    if (x.nodeType === 3) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; continue; }
    if (x.nodeType !== 1) continue;
    for (const at of [...x.attributes]) if (!y.hasAttribute(at.name) && at.name !== 'data-ok') x.removeAttribute(at.name);
    for (const at of [...y.attributes]) if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value);
    if (x.hasAttribute('data-th') && x.dataset.ok && x.dataset.m === y.dataset.m) continue; // the cover already loaded: leave it alone
    morphKids(x, y);
  }
  for (let i = a.length - 1; i >= b.length; i--) o.removeChild(a[i]);
}

}

/* Puts cards in the shortest column so columns stay balanced (no dead space); one column on narrow screens. */
let masonryOnResize = null;
function shortest(cols) { let t = cols[0]; for (const c of cols) if (c.offsetHeight < t.offsetHeight) t = c; return t; }
function masonry(box) {
  if (!box) return;
  const cards = [...box.children], wide = () => innerWidth > 1000;
  const place = () => {
    const cols = Array.from({ length: wide() ? 2 : 1 }, () => Object.assign(document.createElement('div'), { className: 'mcol' }));
    box.style.setProperty('--n', cols.length); box.replaceChildren(...cols);
    for (const c of cards) shortest(cols).appendChild(c);
  };
  place();
  let was = wide();
  removeEventListener('resize', masonryOnResize);
  masonryOnResize = () => { if (!box.isConnected) return removeEventListener('resize', masonryOnResize); if (wide() !== was) { was = wide(); place(); } };
  addEventListener('resize', masonryOnResize);
}

function bindEditor() {
  const a = S.editing, g = (id) => $('#' + id);
  const syncMode = () => { // shows or hides what only applies to email mode, and marks the active button
    const em = a.mode === 'email';
    g('askBox').hidden = !em; document.querySelectorAll('.emailAdv').forEach((e) => (e.hidden = !em));
    g('dmLbl').textContent = em ? 'DM with the resource: sent when the person sends their email' : 'DM message';
    g('seg').querySelectorAll('button').forEach((b) => { const on = b.dataset.m === a.mode; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  };
  const readForm = () => { a.alt_ask_text = g('f_ab').checked ? g('f_alt').value : ''; a.utm = g('f_utm').checked ? 1 : 0; a.ask_text = g('f_ask').value; a.retry_text = g('f_retry').value; a.skip_known = g('f_skip').checked ? 1 : 0; a.name = g('f_name').value; a.dm_text = g('f_dm').value; a.button_url = g('f_bu').value.trim(); a.button_title = g('f_bt').value; a.public_replies = g('f_pub').value.split('\n').map((s) => s.trim()).filter(Boolean);
    a.match_mode = g('f_mode').value; a.exclude = g('f_ex').value.split(',').map((s) => s.trim()).filter(Boolean); a.tag = g('f_tag').value.trim(); a.delay_seconds = g('f_delay').value; if (g('f_ch')) a.channel_id = Number(g('f_ch').value); };
  const paintChips = () => { g('chips').innerHTML = a.keywords.map((k, i) => `<span class="chip" translate="no">${esc(k)} <b data-x="${i}" role="button" aria-label="Remove ${esc(k)}">×</b></span>`).join('') + '<input type="text" id="kw" placeholder="Add word…" aria-label="Add keyword">';
    const inp = g('kw'); const add = () => { const v = inp.value.replace(/,/g, '').trim(); if (v && !a.keywords.includes(v)) a.keywords.push(v); inp.value = ''; paintChips(); paintPhone(); g('kw').focus(); };
    inp.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(); } else if (e.key === 'Backspace' && !inp.value && a.keywords.length) { a.keywords.pop(); paintChips(); paintPhone(); g('kw').focus(); } };
    inp.onblur = () => { if (inp.value.trim()) add(); };
    g('chips').querySelectorAll('[data-x]').forEach((x) => x.onclick = () => { a.keywords.splice(Number(x.dataset.x), 1); paintChips(); paintPhone(); }); };
  const paintReels = async () => {
    const box = g('reels'); if (g('f_scope').value === 'all') { box.innerHTML = '<div class="mute" style="padding:8px 2px">It will reply on any of your latest posts and reels.</div>'; return; }
    box.innerHTML = '<div class="mute" style="padding:8px 2px">Loading your posts…</div>';
    const map = await loadMedia(a.channel_id); if (!g('reels')) return;
    const items = Object.values(map || {});
    box.innerHTML = items.length ? items.map((m) => `<div class="reel ${m.id === a.media_id ? 'sel' : ''}" data-m="${esc(m.id)}" title="${esc((m.caption || '').slice(0, 90))}" role="button" tabindex="0"><img src="${esc(m.thumbnail_url || m.media_url || '')}" alt="" referrerpolicy="no-referrer"><span class="ck">${ic('check')}</span></div>`).join('') : '<div class="mute" style="padding:8px 2px">Could not load posts (demo account or offline).</div>';
    box.querySelectorAll('.reel').forEach((r) => { const pick = () => { a.media_id = r.dataset.m; paintReels(); paintPhone(); }; r.onclick = pick; r.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } }; });
  };
  const paintPhone = () => {
    readForm(); const ch = S.channels.find((c) => c.id === a.channel_id), me = ch?.username || 'tu_cuenta', kw = a.keywords[0] ? a.keywords[0][0].toUpperCase() + a.keywords[0].slice(1) : 'Quiero el link';
    const t = a.media_id ? thumbOf(a.channel_id, a.media_id) : '', dm = a.dm_text.replace(/\{\{\s*username\s*\}\}/g, T('user')).replace(/\{\{\s*first_name\s*\}\}/g, T('user')), pub = (a.public_replies[0] || '').replace(/\{\{\s*username\s*\}\}/g, T('user'));
    const ask = (a.ask_text || '').replace(/\{\{\s*(username|first_name)\s*\}\}/g, T('user'));
    let host = ''; try { host = new URL(a.button_url).host; } catch {}
    g('phone').innerHTML = `<div class="phone"><div class="screen"><div class="ig-top"><span>${ch?.type === 'facebook' ? 'Facebook' : 'Instagram'}</span><span style="font-weight:600;font-size:13px;color:#8a8a8f">${T('Comments')}</span></div>
      <div class="ig-post" style="${t ? `background-image:url('${esc(t)}')` : ''}"></div>
      <div class="ig-c"><span class="a" style="background:var(--g-rose)">US</span><div><b>${T('user')}</b> ${esc(kw)}<small>2 h · ${T('Reply')}</small></div></div>
      ${pub ? `<div class="ig-c r"><span class="a" style="background:var(--g-violet)">${esc(initials(me))}</span><div><b>${esc(me)}</b> ${esc(pub)}<small>2 h · ${T('Reply')}</small></div></div>` : '<div style="background:#fff;height:12px"></div>'}
      <div class="dm"><div class="hd"><span class="av" style="background:var(--g-violet);width:34px;height:34px">${esc(initials(me))}</span><div>${esc(me)}<small>${T('Active now')}</small></div></div>
        ${a.mode === 'email' ? `<div class="bubble">${esc(ask) || '…'}</div><div class="bubble me">${T('youremail@example.com')}</div>` : ''}
        <div class="bubble">${esc(dm) || '…'}</div>${host ? `<div class="linkcard">${esc(a.button_title || 'Abrir')}<small>${esc(host)}</small></div>` : ''}</div></div></div>`;
  };
  g('seg').querySelectorAll('button').forEach((b) => b.onclick = () => { readForm(); a.mode = b.dataset.m; if (a.mode === 'email' && !g('f_ask').value.trim()) g('f_ask').value = T(DEFAULT_ASK); syncMode(); paintPhone(); });
  g('f_skip').onchange = paintPhone;
  g('f_ab').onchange = () => { g('altBox').hidden = !g('f_ab').checked; };
  g('f_scope').onchange = () => { if (g('f_scope').value === 'all') a.media_id = ''; paintReels(); paintPhone(); };
  if (g('f_ch')) g('f_ch').onchange = () => { a.channel_id = Number(g('f_ch').value); a.media_id = ''; paintReels(); paintPhone(); };
  ['f_name', 'f_dm', 'f_bu', 'f_bt', 'f_pub', 'f_ask', 'f_retry'].forEach((id) => g(id).addEventListener('input', paintPhone));
  g('cancel').onclick = () => { S.editing = null; render(); };
  g('save').onclick = async () => {
    readForm(); const b = { ...a, media_id: g('f_scope').value === 'one' ? a.media_id : '' };
    if (g('f_scope').value === 'one' && !b.media_id) return toast('Pick a reel, or switch to "All posts and reels"', 'bad');
    if (b.match_mode !== 'any' && !b.keywords.length) return toast('Add at least one keyword', 'bad');
    if (b.mode === 'email' && !String(b.ask_text || '').trim()) return toast('Write the first DM that asks for the email', 'bad');
    if (!b.dm_text.trim()) return toast('Write the message with the resource', 'bad');
    if (!b.name) b.name = (b.keywords[0] ? `Palabra "${b.keywords[0]}"` : 'Automation') + (b.media_id ? '' : ' · todos');
    try { await api(b.id ? `/api/automations/${b.id}` : '/api/automations', b.id ? 'PUT' : 'POST', b); toast('Saved'); S.editing = null; await loadBase(); render(); }
    catch (e) { toast(e.message, 'bad'); }
  };
  if (a.id) {
    g('del').onclick = async () => { if (await confirmBox('Delete this automation?', 'Its run history is deleted too. This cannot be undone.')) { await api(`/api/automations/${a.id}`, 'DELETE'); toast('Deleted'); S.editing = null; await loadBase(); render(); } };
    g('sim').onclick = async () => { readForm(); try { const r = await api('/api/simulate', 'POST', { channel_id: a.channel_id, text: a.keywords[0] || 'hola', media_id: a.media_id || undefined });
      g('simout').innerHTML = `<div class="simout">${r.matched.length ? '<span>It triggered with a test comment</span> ("<span translate="no">' + esc(a.keywords[0] || 'hola') + '</span>"). <span>This is what would be sent:</span>\n\n' + r.actions.map((x) => `• <span>${x.action === 'public_reply' ? 'Public reply' : 'DM'}</span>: <span translate="no">${esc(x.text)}</span>${x.button ? ` [<span>button</span> <span translate="no">${esc(x.button.title)} → ${esc(x.button.url)}</span>]` : ''}`).join('\n') + '\n\n<span>Nothing was sent to Instagram. The test uses what is already saved.</span>' : '<span>It did not trigger with that test comment. Save your changes and test again.</span>'}</div>`; } catch (e) { toast(e.message, 'bad'); } };
  }
  syncMode(); paintChips(); paintReels(); paintPhone();
}

/* ---------- Activity / Contacts ---------- */
async function viewActividad(opts = {}) {
  const quiet = !!opts.quiet;
  if (!S.channels.length) return $('#main').innerHTML = header('Activity') + noAccount();
  const [runs, ev] = await Promise.all([api('/api/runs'), api('/api/events')]);
  const rs = runs.filter((r) => inScope(r.brand_id)); const f = S.afilter || 'all';
  const waiting = (r) => r.status === 'pending' || r.capture_status === 'waiting' || r.capture_status === 'got_email';
  const shown = rs.filter((r) => f === 'all' || (f === 'ok' ? r.status === 'done' && !waiting(r) : f === 'bad' ? r.status === 'error' || r.capture_status === 'failed' : waiting(r)));
  if (quiet && S.tab !== 'actividad') return;
  const html = header('Activity') + `
  <div class="filters rise">${[['all', 'All'], ['ok', 'Sent'], ['wait', 'Waiting'], ['bad', 'Errors']].map(([k, l]) => `<button class="fpill ${f === k ? 'on' : ''}" data-f="${k}">${l}</button>`).join('')}</div>
  <div class="grid g-2">
    <div class="card rise" style="--i:1"><h2>${ic('send')}Replies</h2>${shown.length ? `<table class="tbl"><thead><tr><th>User</th><th class="hide-s">Comment</th><th class="hide-s">Automation</th><th class="hide-s">When</th><th>Status</th></tr></thead><tbody>
      ${shown.map((r) => `<tr><td><div class="who" translate="no">${avatar(r.username)}@${esc(r.username || '—')}</div></td><td class="hide-s" translate="no">${esc(r.comment_text)}</td><td class="hide-s" translate="no">${esc(r.automation)}</td><td class="hide-s mute">${esc(ago(r.created_at))}</td><td>${stChip(r)}${r.status === 'error' ? `<div class="mute" style="margin-top:4px;max-width:260px" translate="no">${esc(r.error)}</div>` : ''}</td></tr>`).join('')}</tbody></table>` : '<p class="mute">Nothing here yet.</p>'}</div>
    <div class="card rise" style="--i:2"><h2>Log</h2>${ev.slice(0, 14).map((e) => `<div style="display:flex;gap:10px;margin:0 0 12px"><i class="dot ${e.kind === 'error' ? 'bad' : e.kind === 'warn' ? 'warn' : ''}" style="margin-top:6px"></i><div><div style="font-size:13.5px" translate="no">${esc(trEvent(e.note))}</div><div class="mute">${esc(ago(e.ts))}</div></div></div>`).join('') || '<p class="mute">No events.</p>'}</div>
  </div>`;
  if (!paint(html, quiet)) return;
  document.querySelectorAll('.fpill').forEach((b) => b.onclick = () => { S.afilter = b.dataset.f; viewActividad(); });
}

  $('#addb').onclick = async () => { const n = $('#bn').value.trim(); if (!n) return; try { await api('/api/brands', 'POST', { name: n }); toast('Brand created'); reload(); } catch (e) { toast(e.message, 'bad'); } };
  document.querySelectorAll('[data-db]').forEach((b) => b.onclick = async () => { if (await confirmBox('Delete the brand?', 'Its accounts, automations and contacts are deleted too.')) { await api('/api/brands/' + b.dataset.db, 'DELETE'); reload(); } });
  document.querySelectorAll('[data-dc]').forEach((b) => b.onclick = async () => { if (await confirmBox('Remove this account?', 'Its automations are deleted too.', 'Remove')) { await api('/api/channels/' + b.dataset.dc, 'DELETE'); reload(); } });
  $('#cp').onchange = () => { const fb = $('#cp').value === 'facebook'; $('#cil').textContent = fb ? T('Facebook Page ID (numbers only)') : T('Instagram account ID (numbers only)'); $('#ci').placeholder = fb ? '1000…' : '1784…'; };
  $('#conn').onclick = async () => { if (!S.brands.length) return toast('Create a brand first', 'bad'); try { const r = await api('/api/channels', 'POST', { platform: $('#cp').value, brand_id: $('#cb').value, token: $('#ct').value, ig_user_id: $('#ci').value }); toast(`Connected @${r.username}`); reload(); } catch (e) { toast(e.message, 'bad'); } };
  $('#demo').onclick = async () => { if (!S.brands.length) return toast('Create a brand first', 'bad'); await api('/api/channels', 'POST', { brand_id: $('#cb').value, demo: true }); reload(); };
}

/* ---------- Settings ---------- */
function viewAjustes() {
  const row = (title, desc, link) => `<div class="bars-row" style="align-items:flex-start;margin:14px 0"><span style="flex:1"><b>${title}</b><div class="mute">${desc}</div></span>${link ? `<a class="btn sec sm" href="${link}">Open section</a>` : ''}</div>`;
  $('#main').innerHTML = header('Settings') + `
  <div class="grid g-2">
    <div class="card rise" style="--i:1"><h2>${ic('gear')}General</h2>
      <label class="f">Interface language</label>
      <div class="seg" id="langseg" role="tablist">${(S.langs || [{ code: 'en', name: 'English' }]).map((l) => `<button type="button" data-l="${esc(l.code)}" class="${LANG === l.code ? 'on' : ''}" translate="no">${esc(l.name)}</button>`).join('')}</div>
      <p class="mute" style="margin-top:14px">Only changes the language of the panel\'s menus, buttons and texts. It does not change your messages, replies or automations. It is remembered in this browser.</p></div>
    <div class="card rise" style="--i:2"><h2>Where each setting lives</h2>
      ${row('Brands and accounts', 'Connect accounts, create and delete brands.', '#/conexion')}
      ${row('Messages and replies', 'They are edited inside each automation.', '#/automatizaciones')}
      ${row('Limits and reading intervals', 'They are changed in the .env file, then the program is restarted (HOURLY_CAP, POLL_SECONDS, DM_POLL_SECONDS).', '')}
      ${row('Panel password and App Secret', 'They live in the .env file. For security they are not edited from the web.', '')}
    </div>
  </div>`;
  document.querySelectorAll('#langseg button').forEach((b) => (b.onclick = () => setLang(b.dataset.l)));
}

/* ---------- navigation ---------- */
const VIEWS = { inicio: viewInicio, automatizaciones: viewAutos, actividad: viewActividad, analisis: viewAnalisis, contactos: viewContactos, conexion: viewConexion, ajustes: viewAjustes };
async function render() {
  const t = (location.hash.replace('#/', '') || 'inicio'); S.tab = VIEWS[t] ? t : 'inicio';
  if (S.tab !== 'automatizaciones') S.editing = null;
  chrome(); S.lastHtml = null;
  try { if (S.editing) await viewEditor(); else await VIEWS[S.tab](); }
  catch (e) { $('#main').innerHTML = header('Error') + `<div class="card"><div class="big" style="font-weight:800;font-size:18px">Something went wrong</div><p class="mute">${esc(e.message)}</p></div>`; }
}
window.addEventListener('hashchange', () => { S.editing = null; render(); });
// Soft refresh every 20 s on Home and Activity (does not touch the editor or forms)
setInterval(async () => { if (document.hidden || S.editing || !['inicio', 'actividad'].includes(S.tab)) return; try { S.poller = await api('/api/poller'); chrome(); await VIEWS[S.tab]({ quiet: true }); } catch {} }, 20000);
(async () => { try { S.langs = await api('/api/langs').catch(() => null); await loadLang(LANG); await loadBase(); } catch (e) { toast(e.message, 'bad'); } render(); })();
</script>
</body>
</html>
